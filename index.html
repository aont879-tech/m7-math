<style>
/* Layout: exercise-book page — grid-paper ground, ink-blue text, teacher's red pen for marks; sidebar of parts/chapters + one working pane */
:root{
  --paper:#f7f9fc; --grid:#dfe7f3; --sheet:#ffffff; --ink:#1b2a4a; --ink-2:#4a5878; --line:#cfd8e6;
  --blue:#2350b8; --blue-soft:#e6edfb; --red:#c8332b; --red-soft:#fbe9e7; --green:#1f7a4d; --green-soft:#e3f3ea; --amber:#9a6a00; --amber-soft:#fbf1d9;
  --display:"Noto Serif Lao","Phetsarath OT","Saysettha OT",serif;
  --body:"Noto Sans Lao","Phetsarath OT","Saysettha OT",system-ui,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(27,42,74,.08),0 6px 20px rgba(27,42,74,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1626; --grid:#18233a; --sheet:#141d31; --ink:#e3e9f6; --ink-2:#a5b2cc; --line:#2a3854;
  --blue:#7fa3ff; --blue-soft:#1b2a4d; --red:#ff8a7f; --red-soft:#3a1d1f; --green:#6fd3a0; --green-soft:#16332a; --amber:#f0c060; --amber-soft:#3a2f14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1626; --grid:#18233a; --sheet:#141d31; --ink:#e3e9f6; --ink-2:#a5b2cc; --line:#2a3854;
  --blue:#7fa3ff; --blue-soft:#1b2a4d; --red:#ff8a7f; --red-soft:#3a1d1f; --green:#6fd3a0; --green-soft:#16332a; --amber:#f0c060; --amber-soft:#3a2f14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
mjx-container{color:inherit}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding-block:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sheet);border-right:1px solid var(--line);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;gap:12px;align-items:center;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:12px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left}
.brand .mark{width:52px;height:auto;aspect-ratio:202/208;border-radius:8px;flex:none;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toplogo{width:30px;height:auto;border-radius:5px;display:block}
.herologo{width:clamp(84px,14vw,120px);height:auto;border-radius:12px;box-shadow:var(--shadow);flex:none}
.herohead{display:flex;gap:18px;align-items:center;margin-left:44px}
.herohead h1{margin:6px 0 0 !important}
.slogo{width:22px;height:auto;border-radius:4px;flex:none}
.sbar .left{display:flex;gap:8px;align-items:center;min-width:0}
.footer{display:flex;gap:12px;align-items:center}
.footer img{width:36px;height:auto;border-radius:6px;flex:none}
.brand b{display:block;font-family:var(--display);font-size:18px;line-height:1.3}
.brand small{color:var(--ink-2);font-size:12.5px}
.search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.part{margin-top:10px}
.part > button{width:100%;text-align:left;background:none;border:0;padding:6px 4px;font-size:12px;letter-spacing:.06em;color:var(--red);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between}
.part ul{list-style:none;margin:0;padding:0}
.chlink{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:start;text-align:left;background:none;border:0;border-radius:6px;padding:5px 6px;font-size:14px;line-height:1.5;color:var(--ink)}
.chlink:hover{background:var(--blue-soft)}
.chlink.on{background:var(--blue);color:#fff}
.chlink .no{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.chlink.on .no{color:#dbe5ff}
.chlink .tick{font-size:11px;color:var(--green);font-weight:700}
.chlink.on .tick{color:#c9f5dc}

.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,2.5vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.5vw)}
.topbar{display:none}
.wrap{max-width:1040px;margin:0 auto}

/* home */
.hero{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:56px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
.hero > *{position:relative;margin-left:44px}
.hero .eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--red);font-weight:700}
.hero h1{font-size:clamp(26px,4vw,38px);margin:6px 0 10px 44px}
.hero p{color:var(--ink-2);max-width:62ch;margin-top:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:22px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.pcard .pn{font-size:12px;letter-spacing:.06em;color:var(--red);font-weight:700}
.pcard h2{font-size:19px;margin:2px 0 10px}
.pcard ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.pcard li button{background:none;border:0;padding:4px 6px;margin-left:-6px;border-radius:6px;text-align:left;font-size:14.5px;line-height:1.5;display:flex;gap:8px;width:100%}
.pcard li button:hover{background:var(--blue-soft)}
.pcard li b{font-variant-numeric:tabular-nums;color:var(--blue);min-width:24px}

/* chapter */
.chhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.chhead .eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--red);font-weight:700}
.chhead h1{font-size:clamp(22px,3.2vw,32px)}
.goal{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px;color:var(--ink-2);font-size:15px;margin-bottom:16px}
.goal b{color:var(--ink)}
.navbtns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 14px;font-size:14px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-size:15px;font-weight:600;color:var(--ink-2);border-radius:8px 8px 0 0;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .n{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-weight:600;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.tab[aria-selected="true"] .n{background:transparent;color:var(--sheet);border-color:var(--sheet)}

/* slides */
.stage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);aspect-ratio:16/9.6;display:flex;flex-direction:column;overflow:hidden;max-width:100%}
.stage:fullscreen{aspect-ratio:auto;border-radius:0;border:0}
.stage:fullscreen .sbody{font-size:clamp(20px,2.2vw,34px)}
.stage:fullscreen .stitle{font-size:clamp(26px,3vw,44px)}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);gap:10px}
.sbar .ch{color:var(--red);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .cnt{font-variant-numeric:tabular-nums;white-space:nowrap}
.scontent{flex:1;overflow:auto;padding:22px clamp(18px,4vw,48px) 26px}
.stitle{font-size:clamp(20px,2.4vw,28px);margin-bottom:14px;color:var(--blue)}
.sbody{font-size:clamp(16px,1.6vw,19px)}
.sbody p{margin:0 0 .7em}
.sbody ul,.sbody ol{margin:0 0 .7em;padding-left:1.3em}
.sbody li{margin-bottom:.25em}
.box{border:1.5px solid var(--blue);background:var(--blue-soft);border-radius:8px;padding:10px 14px;margin:0 0 .8em}
.box.red{border-color:var(--red);background:var(--red-soft)}
.box.green{border-color:var(--green);background:var(--green-soft)}
.box .lbl{display:block;font-size:.78em;font-weight:700;letter-spacing:.05em;color:var(--blue);margin-bottom:2px}
.box.red .lbl{color:var(--red)} .box.green .lbl{color:var(--green)}
.ex{border-left:3px dashed var(--amber);padding:4px 0 4px 14px;margin:0 0 .8em}
.ex .lbl{font-weight:700;color:var(--amber);font-size:.85em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tbl{overflow-x:auto;margin-bottom:.8em}
.tbl table{border-collapse:collapse;font-size:.92em}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.tbl th{background:var(--paper)}
.scontrols{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);padding:0}
.dot.on{background:var(--blue)}
.hint{font-size:12.5px;color:var(--ink-2)}
/* textbook flipbook */
.bookbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bkbtns{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.bookstage{background:#5b4636;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:6px 6px;
  border-radius:var(--r);padding:clamp(10px,2.4vw,26px);box-shadow:inset 0 0 40px rgba(0,0,0,.35);display:flex;justify-content:center;overflow:hidden}
.bookstage:fullscreen{border-radius:0;align-items:center;padding:12px}
.flip{width:100%;max-width:min(100%,calc((100vh - 170px)*1.414))}
.bookstage:fullscreen .flip{max-width:calc((100vh - 24px)*1.414)}
.bpage{background:#fff;overflow:hidden}
.bpage img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
@media (max-width:860px){.flip{max-width:min(100%,calc((100vh - 170px)*0.707))}.bookstage:fullscreen .flip{max-width:calc((100vh - 24px)*0.707)}}
#bpos{font-variant-numeric:tabular-nums}
/* chapter cover slide */
.stitle:empty{display:none}
.scontent:has(.cover){display:flex;flex-direction:column;justify-content:center}
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:center}
.cvpart{font-size:.78em;letter-spacing:.06em;color:var(--red);font-weight:700}
.cvno{font-family:var(--display);font-size:1.25em;color:var(--ink-2);margin-top:4px;line-height:1.2}
.cvno span{font-size:2.6em;color:var(--blue);font-variant-numeric:tabular-nums;vertical-align:-.1em}
.cvtitle{font-size:clamp(22px,2.9vw,36px);margin:10px 0 14px}
.cvtitle::after{content:"";display:block;width:64px;height:4px;background:var(--red);border-radius:2px;margin-top:12px}
.cvgoal{font-size:.8em;color:var(--ink-2);line-height:1.6}
.cvgoal b{color:var(--ink)}
.cvfig{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.cvart{width:100%;height:auto;display:block}
.cvart .ax{stroke:var(--ink-2);stroke-width:1.3;fill:none}
.cvart .c1,.cvart .c2,.cvart .c3{fill:none;stroke-linecap:round;stroke-linejoin:round}
.cvart .c1{stroke:var(--blue);stroke-width:3} .cvart .c2{stroke:var(--red);stroke-width:3} .cvart .c3{stroke:var(--ink-2);stroke-width:1.6}
.cvart .o0{opacity:.35} .cvart .o1{opacity:.55} .cvart .o2{opacity:.75} .cvart .o3{opacity:.9}
.cvart .dash,.cvart .dashr{fill:none;stroke-width:1.4;stroke-dasharray:5 4} .cvart .dash{stroke:var(--ink-2)} .cvart .dashr{stroke:var(--red)}
.cvart .f1{fill:var(--blue);fill-opacity:.2} .cvart .f2{fill:var(--red);fill-opacity:.2}
.cvart .f1b{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5} .cvart .f2b{fill:var(--red-soft);stroke:var(--red);stroke-width:1.5}
.cvart .f1s{fill:var(--blue);fill-opacity:.12;stroke:var(--blue);stroke-width:1.2}
.cvart .f0{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 4} .cvart .f0s{fill:var(--paper);stroke:var(--red);stroke-width:1.2}
.cvart .dt{fill:var(--blue)} .cvart .rd{fill:var(--red)} .cvart .gd{fill:var(--ink-2);opacity:.5} .cvart .op{fill:var(--paper);stroke:var(--blue);stroke-width:2}
.cvart text{font-family:var(--body);fill:var(--ink)} .cvart .txs{font-size:12px;fill:var(--ink-2)} .cvart .txb{font-size:14px;font-weight:600} .cvart .txr{font-size:13px;font-weight:600;fill:var(--red)}
@media (max-width:640px){.cover{grid-template-columns:minmax(0,1fr)}.cvfig{max-width:360px}}

/* exercises / homework */
.qlist{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:q}
.qitem{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px 52px;position:relative;counter-increment:q;min-width:0}
.qitem::before{content:counter(q);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.qitem .qt{margin:0}
.qitem details{margin-top:8px}
.qitem summary{cursor:pointer;color:var(--blue);font-size:14px;font-weight:600;width:max-content;max-width:100%}
.ans{margin-top:8px;padding:10px 14px;border-radius:8px;background:var(--green-soft);border:1px solid var(--green);font-size:15px;overflow-x:auto}
.ans .lbl{display:block;font-size:12px;font-weight:700;color:var(--green);letter-spacing:.05em}
.hwhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.hwhead p{margin:0;font-size:14.5px}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}

/* quiz */
.quizhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.quizhead p{margin:0;color:var(--ink-2);font-size:14.5px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--paper);min-width:0}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:6px;accent-color:var(--blue);flex:none}
.opt .k{font-weight:700;color:var(--ink-2)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{margin-top:8px;font-size:14.5px;padding:8px 12px;border-radius:8px}
.fb.ok{background:var(--green-soft);color:var(--green)} .fb.no{background:var(--red-soft);color:var(--red)}
.fb span{color:var(--ink)}
.score{display:flex;gap:18px;align-items:center;background:var(--sheet);border:2px solid var(--red);border-radius:var(--r);padding:14px 20px;margin-top:16px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:40px;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.score p{margin:0}
.qsec + .qsec{margin-top:34px;padding-top:22px;border-top:2px dashed var(--line)}
.secttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.secttl h2{font-size:20px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;color:#fff;background:var(--blue);border-radius:6px;padding:2px 8px}
.tag.red{background:var(--red)}
.qnum{display:inline-block;font-size:12px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:0 8px;margin-right:8px;vertical-align:middle}
.footer{margin-top:40px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet);border-bottom:1px solid var(--line);
    padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;gap:10px}
  .topbar b{font-family:var(--display);font-size:16px}
  .main{padding-top:16px}

<script>
(function(){
const $=s=>document.querySelector(s);
const view=$('#view'), nav=$('#nav'), side=$('#side');
const TABS=[['slides','ສະໄລ້ສອນ'],['ex','ບົດເຝິກຫັດ'],['hw','ວຽກບ້ານ'],['quiz','ບົດກວດກາທ້າຍບົດ'],['book','ປຶ້ມແບບຮຽນ']];
// first PDF page of each chapter in the textbook (printed page = PDF page − 6); last entry = start of the review section
const BOOK=[7,13,20,23,26,28,33,38,42,47,51,56,59,64,70,74,76,79,84,89,95,100,105,108,111,117,122,131,134,139,143,147,151,153,159,164,169,175,180,186,193,201,205,208,211,222];
let book=null;
// part 9 is the supplementary matrix part from the 2016 textbook, taught right after complex numbers (part 4)
const PART_ORDER=[1,2,3,4,9,5,6,7,8];
const partNo=p=>p===9?'ພາກເສີມ ກ':`ພາກທີ ${p}`;
const chNo=c=>c.label?`ບົດເສີມ ${c.label}`:`ບົດທີ ${c.n}`;
const chs=M7.ch.slice().sort((a,b)=>PART_ORDER.indexOf(a.part)-PART_ORDER.indexOf(b.part)||a.n-b.n);
let cur=null, tab='slides', si=0;
const store={get(k){try{return JSON.parse(localStorage.getItem('m7:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('m7:'+k,JSON.stringify(v))}catch(e){}}};

let mjq=Promise.resolve();
function typeset(el){
  if(!el) return;
  const go=()=>{ if(window.MathJax&&MathJax.typesetPromise){ mjq=mjq.then(()=>MathJax.typesetPromise([el])).catch(()=>{}); } else setTimeout(go,150); };
  go();
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
// every chapter opens on a cover slide: chapter number, title, aim and an illustration
chs.forEach(c=>c.slides.unshift(['',`<div class="cover"><div><div class="cvpart">${partNo(c.part)} · ${esc(M7.parts[c.part-1])}</div>
 <div class="cvno">${c.label?'ບົດເສີມ':'ບົດທີ'} <span>${c.label||c.n}</span></div><h3 class="cvtitle">${esc(c.title)}</h3><div class="cvgoal"><b>ຈຸດປະສົງ:</b> ${c.goal}</div></div>
 <div class="cvfig">${M7.cover?M7.cover(c.n):''}</div></div>`]));

function buildNav(filter=''){
  const f=filter.trim();
  let h='';
  PART_ORDER.forEach(pn=>{
    const p=M7.parts[pn-1];
    const list=chs.filter(c=>c.part===pn&&(!f||c.title.includes(f)||String(c.n)===f||c.label===f||p.includes(f)));
    if(!list.length) return;
    h+=`<div class="part"><button type="button" tabindex="-1">${partNo(pn)} · ${esc(p)}</button><ul>`;
    list.forEach(c=>{
      const best=store.get('q'+c.n);
      h+=`<li><button class="chlink${cur&&cur.n===c.n?' on':''}" data-n="${c.n}"><span class="no">${c.label||c.n}</span><span>${esc(c.title)}</span><span class="tick">${best!=null?best+'/'+c.quiz.length:''}</span></button></li>`;
    });
    h+='</ul></div>';
  });
  nav.innerHTML=h||'<p class="hint">ບໍ່ພົບບົດທີ່ຊອກຫາ</p>';
}
nav.addEventListener('click',e=>{const b=e.target.closest('.chlink'); if(b){openCh(+b.dataset.n); closeSide();}});
$('#search').addEventListener('input',e=>buildNav(e.target.value));
$('#homeBtn').addEventListener('click',()=>{home();closeSide();});
$('#menuBtn').addEventListener('click',()=>{side.classList.add('open');const s=document.createElement('div');s.className='scrim';s.id='scrim';s.onclick=closeSide;document.body.appendChild(s);});
function closeSide(){side.classList.remove('open');const s=$('#scrim');s&&s.remove();}

function home(){
  cur=null; try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  buildNav($('#search').value);
  let h=`<section class="hero"><div class="eyebrow">ກະຊວງສຶກສາທິການ ແລະ ກິລາ · ຫຼັກສູດປັບປຸງ 2025</div>
  <div class="herohead"><img class="herologo" src="logo.svg" alt="ໂລໂກ້ ຄະນິດສາດ ມັດທະຍົມ ປີທີ 7"><h1>ຫ້ອງຮຽນຄະນິດສາດ ມັດທະຍົມ ປີທີ 7</h1></div>
  <p>ສື່ການສອນຕາມແບບຮຽນ ມ.7 ຄົບທັງ 8 ພາກ 45 ບົດ ແລະ ພາກເສີມ ມາຕຣິດ 5 ບົດ ຈາກແບບຮຽນເກົ່າ (2016). ແຕ່ລະບົດມີ 4 ພາກສ່ວນ ເລືອກບົດຈາກລາຍການ ແລ້ວກົດປຸ່ມລູກສອນ ← → ເພື່ອປ່ຽນສະໄລ້.</p>
  <div class="legend"><span class="chip"><i style="background:var(--blue)"></i>ສະໄລ້ສອນ</span><span class="chip"><i style="background:var(--amber)"></i>ບົດເຝິກຫັດ ພ້ອມບົດແກ້</span><span class="chip"><i style="background:var(--green)"></i>ວຽກບ້ານ ພ້ອມຄຳຕອບສຳລັບຄູ</span><span class="chip"><i style="background:var(--red)"></i>ບົດກວດກາທ້າຍບົດ + ພາກປາລະໄນຈາກສະຫຼຸບບົດຮຽນ (239 ຂໍ້) ກວດຄະແນນອັດຕະໂນມັດ</span></div></section>
  <div class="parts">`;
  PART_ORDER.forEach(pn=>{
    h+=`<div class="pcard"><div class="pn">${partNo(pn)}${pn===9?' · ຈາກແບບຮຽນເກົ່າ (2016)':''}</div><h2>${esc(M7.parts[pn-1])}</h2><ol>`;
    chs.filter(c=>c.part===pn).forEach(c=>h+=`<li><button data-n="${c.n}"><b>${c.label||c.n}</b><span>${esc(c.title)}</span></button></li>`);
    h+='</ol></div>';
  });
  h+=`</div><div class="footer"><img src="logo.svg" alt=""><span>ເນື້ອຫາສະຫຼຸບ ແລະ ຮຽບຮຽງຄືນຈາກແບບຮຽນຄະນິດສາດ ມ.7 (ສະຖາບັນຄົ້ນຄວ້າວິທະຍາສາດການສຶກສາ, 2025). ຄູສາມາດໃຊ້ສະໄລ້ສອນໃນຫ້ອງ ແລະ ມອບວຽກບ້ານໃຫ້ນັກຮຽນ.</span></div>`;
  view.innerHTML=h;
  view.querySelectorAll('.pcard button').forEach(b=>b.onclick=()=>openCh(+b.dataset.n));
  window.scrollTo(0,0);
}

function openCh(n,t){
  cur=chs.find(c=>c.n===n); if(!cur) return home();
  tab=t||'slides'; si=0; try{history.replaceState(null,'','#ch'+n)}catch(e){}
  buildNav($('#search').value); renderCh(); window.scrollTo(0,0);
}
function renderCh(){
  const c=cur, idx=chs.indexOf(c), prev=chs[idx-1], next=chs[idx+1];
  if(book){try{book.destroy()}catch(e){} book=null;}
  const counts={slides:c.slides.length,ex:c.ex.length,hw:c.hw.length,quiz:c.quiz.length+((M7.rev&&M7.rev[c.n]||[]).length),book:bookInfo(c).N};
  view.innerHTML=`<div class="chhead"><div><div class="eyebrow">${partNo(c.part)} · ${esc(M7.parts[c.part-1])}</div><h1>${chNo(c)}: ${esc(c.title)}</h1></div>
   <div class="navbtns"><button class="btn" id="pv" ${prev?'':'disabled'}>← ${prev?chNo(prev):'ບົດທີ'}</button><button class="btn" id="nx" ${next?'':'disabled'}>${next?chNo(next):'ບົດທີ'} →</button></div></div>
   <div class="goal"><b>ຈຸດປະສົງ:</b> ${c.goal}</div>
   <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${tab===k}">${l}<span class="n">${counts[k]}</span></button>`).join('')}</div>
   <div id="pane"></div>`;
  $('#pv').onclick=()=>prev&&openCh(prev.n,tab);
  $('#nx').onclick=()=>next&&openCh(next.n,tab);
  view.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderCh();});
  typeset(view.querySelector('.goal'));
  ({slides:renderSlides,ex:renderEx,hw:renderHw,quiz:renderQuiz,book:renderBook})[tab]();
}

function renderSlides(){
  const c=cur, pane=$('#pane'), s=c.slides[si];
  pane.innerHTML=`<div class="stage" id="stage"><div class="sbar"><span class="left"><img class="slogo" src="logo.svg" alt=""><span class="ch">${chNo(c)} · ${esc(c.title)}</span></span><span class="cnt">ສະໄລ້ ${si+1} / ${c.slides.length}</span></div>
   <div class="scontent"><h2 class="stitle">${s[0]}</h2><div class="sbody">${s[1]}</div></div></div>
   <div class="scontrols"><button class="btn" id="sp" ${si?'':'disabled'}>← ກ່ອນໜ້າ</button>
   <div class="dots">${c.slides.map((_,i)=>`<button class="dot${i===si?' on':''}" data-i="${i}" aria-label="ສະໄລ້ ${i+1}"></button>`).join('')}</div>
   <div style="display:flex;gap:8px"><button class="btn" id="fs">⛶ ເຕັມຈໍ</button><button class="btn primary" id="sn">${si<c.slides.length-1?'ຕໍ່ໄປ →':'ໄປເຮັດບົດເຝິກຫັດ →'}</button></div></div>
   <p class="hint">ໃຊ້ປຸ່ມລູກສອນ ← → ເທິງແປ້ນພິມເພື່ອປ່ຽນສະໄລ້</p>`;
  $('#sp').onclick=()=>go(-1); $('#sn').onclick=()=>{ if(si<c.slides.length-1) go(1); else {tab='ex';renderCh();} };
  pane.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{si=+d.dataset.i;renderSlides();});
  $('#fs').onclick=()=>{const st=$('#stage'); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(st.requestFullscreen) st.requestFullscreen().catch(()=>{});};
  typeset(pane);
}
function go(d){const L=cur.slides.length; si=Math.max(0,Math.min(L-1,si+d)); const fs=document.fullscreenElement; if(fs){ // update in place to keep fullscreen
    const s=cur.slides[si]; fs.querySelector('.stitle').innerHTML=s[0]; fs.querySelector('.sbody').innerHTML=s[1]; fs.querySelector('.cnt').textContent=`ສະໄລ້ ${si+1} / ${L}`; typeset(fs);
    document.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('on',i===si)); $('#sp').disabled=!si; } else renderSlides();}
document.addEventListener('keydown',e=>{ if(!cur||(tab!=='slides'&&tab!=='book')) return; if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const d=(e.key==='ArrowRight'||e.key==='PageDown')?1:(e.key==='ArrowLeft'||e.key==='PageUp')?-1:0; if(!d) return;
  e.preventDefault(); if(tab==='slides') go(d); else bookGo(d); });

// textbook flipbook: page images rendered from the chapter's PDF pages, turned with StPageFlip
let flipLib=null;
function loadFlip(){
  if(window.St&&St.PageFlip) return Promise.resolve();
  return flipLib||(flipLib=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js';s.onload=ok;s.onerror=()=>{flipLib=null;no()};document.head.appendChild(s);}));
}
let bi=0; // page index for the plain fallback viewer
function bookGo(d){ if(book){d>0?book.flipNext():book.flipPrev();} else { const N=document.querySelectorAll('#flip .bpage').length; bi=Math.max(0,Math.min(N-1,bi+d)); showPlain(); } }
function showPlain(){ const pages=document.querySelectorAll('#flip .bpage'); pages.forEach((p,i)=>p.hidden=i!==bi); bookPos(bi,1,pages.length); }
// which textbook pages belong to a chapter: the 2025 book for chapters 1–45, the 2016 book for the supplementary part
const OLD={101:[47,20],102:[67,14],103:[81,15],104:[96,14],105:[110,10]}; // [first printed page, page count]
function bookInfo(c){
  if(OLD[c.n]){ const [p1,N]=OLD[c.n], id='old'+String(c.n-94).padStart(2,'0'); return {id,N,p1,book:'ແບບຮຽນ ມ.7 ສະບັບເກົ່າ (2016)',file:null}; } // source PDF is locked: pages only, no PDF
  const from=BOOK[c.n-1]; return {id:'ch'+String(c.n).padStart(2,'0'),N:BOOK[c.n]-from,p1:from-6,book:'ແບບຮຽນ ມ.7 (2025)',file:`ມ7-ບົດທີ${c.n}.pdf`};
}
function bookPos(i,span,N){ const p1=bookInfo(cur).p1+i, el=$('#bpos'); if(!el) return;
  el.textContent=span>1&&i+1<N?`ໜ້າ ${p1}–${p1+1}`:`ໜ້າ ${p1}`; el.textContent+=` · ${i+span>=N?N:i+span} / ${N}`;
  $('#bp').disabled=i<=0; $('#bn').disabled=i+span>=N; }
function renderBook(){
  const c=cur, pane=$('#pane'), {id,N,p1,book:bname,file}=bookInfo(c), pdf=`book/${id}.pdf`;
  pane.innerHTML=`<div class="bookbar"><div><b>${bname}</b><span class="hint"> · ${chNo(c)} · ໜ້າ ${p1}–${p1+N-1} ໃນປຶ້ມ (${N} ໜ້າ)</span></div>
   ${file?`<div class="bkbtns"><a class="btn" href="${pdf}" target="_blank" rel="noopener">ເປີດ PDF</a><a class="btn" href="${pdf}" download="${file}">⬇ ດາວໂຫຼດ PDF</a></div>`:''}</div>
   <div class="bookstage" id="bookstage"><div class="flip" id="flip">${Array.from({length:N},(_,i)=>`<div class="bpage"><img src="book/${id}-${i+1}.webp" alt="ໜ້າ ${p1+i}" draggable="false"></div>`).join('')}</div></div>
   <div class="scontrols"><button class="btn" id="bp">← ໜ້າກ່ອນ</button><span class="hint" id="bpos"></span>
   <div style="display:flex;gap:8px"><button class="btn" id="bfs">⛶ ເຕັມຈໍ</button><button class="btn primary" id="bn">ໜ້າຕໍ່ໄປ →</button></div></div>
   <p class="hint">ກົດ ຫຼື ລາກມຸມໜ້າເຈ້ຍເພື່ອພິກໜ້າ, ຫຼື ໃຊ້ປຸ່ມລູກສອນ ← → ເທິງແປ້ນພິມ</p>`;
  $('#bp').onclick=()=>bookGo(-1); $('#bn').onclick=()=>bookGo(1);
  $('#bfs').onclick=()=>{const st=$('#bookstage'); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(st.requestFullscreen) st.requestFullscreen().catch(()=>{});};
  bi=0; bookPos(0,1,N);
  loadFlip().then(()=>{
    if(tab!=='book'||cur!==c||!$('#flip')) return;
    book=new St.PageFlip($('#flip'),{width:500,height:707,size:'stretch',minWidth:240,maxWidth:1000,minHeight:340,maxHeight:1414,
      showCover:false,usePortrait:true,mobileScrollSupport:true,maxShadowOpacity:.45,flippingTime:750,drawShadow:true});
    book.loadFromHTML(document.querySelectorAll('#flip .bpage'));
    const upd=()=>bookPos(book.getCurrentPageIndex(),book.getOrientation()==='landscape'?2:1,N);
    book.on('flip',upd); book.on('changeOrientation',upd); upd();
  }).catch(showPlain);
}

function renderEx(){
  const pane=$('#pane');
  pane.innerHTML=`<p class="hint" style="margin-top:0">ໃຫ້ນັກຮຽນລອງເຮັດກ່ອນ ແລ້ວຈຶ່ງກົດເບິ່ງບົດແກ້ລະອຽດ.</p><ol class="qlist">${cur.ex.map(([q,a])=>`<li class="qitem"><div class="qt">${q}</div><details><summary>ເບິ່ງບົດແກ້</summary><div class="ans"><span class="lbl">ບົດແກ້</span>${a}</div></details></li>`).join('')}</ol>`;
  typeset(pane);
}
function renderHw(){
  const pane=$('#pane');
  pane.innerHTML=`<div class="hwhead"><p><b>ວຽກບ້ານ${chNo(cur)}</b> · ໃຫ້ນັກຮຽນເຮັດໃສ່ປຶ້ມຂຽນ ແລະ ສົ່ງໃນຊົ່ວໂມງຕໍ່ໄປ.</p><label class="toggle"><input type="checkbox" id="showA"><span>ສະແດງຄຳຕອບ (ສຳລັບຄູ)</span></label></div>
   <ol class="qlist">${cur.hw.map(([q,a])=>`<li class="qitem"><div class="qt">${q}</div><div class="ans" hidden><span class="lbl">ຄຳຕອບ</span>${a}</div></li>`).join('')}</ol>`;
  $('#showA').onchange=e=>pane.querySelectorAll('.ans').forEach(x=>x.hidden=!e.target.checked);
  typeset(pane);
}
function quizForm(id,items,label){
  const K='ກຂຄງ';
  return `<form id="${id}"><ol class="qlist">${items.map((it,i)=>`<li class="qitem" data-i="${i}"><div class="qt">${label?`<span class="qnum">ຂໍ້ ${label(it)} ໃນແບບຮຽນ</span>`:''}${it.q}</div><div class="opts">${it.o.map((t,j)=>`<label class="opt"><input type="radio" name="${id}q${i}" value="${j}"><span><span class="k">${K[j]}.</span> ${t}</span></label>`).join('')}</div><div class="fbx"></div></li>`).join('')}</ol>
  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" type="submit">ກວດຄະແນນ</button><button class="btn" type="button" data-reset>ເລີ່ມໃໝ່</button></div><div class="res"></div></form>`;
}
function wireQuiz(id,items,storeKey){
  const K='ກຂຄງ', f=$('#'+id);
  f.addEventListener('change',e=>{ if(e.target.type==='radio'){ e.target.closest('.opts').querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.contains(e.target))); } });
  f.querySelector('[data-reset]').onclick=()=>{ f.reset(); f.querySelectorAll('.opt').forEach(l=>l.classList.remove('right','wrong','sel')); f.querySelectorAll('.fbx').forEach(x=>x.innerHTML=''); f.querySelector('.res').innerHTML=''; };
  f.addEventListener('submit',e=>{ e.preventDefault(); let sc=0, miss=0;
    items.forEach((it,i)=>{ const c=it.c, li=f.querySelector(`[data-i="${i}"]`), ch=f.querySelector(`input[name="${id}q${i}"]:checked`), v=ch?+ch.value:-1;
      li.querySelectorAll('.opt').forEach((l,j)=>{l.classList.remove('right','wrong','sel'); if(j===c) l.classList.add('right'); else if(j===v) l.classList.add('wrong');});
      if(v<0) miss++; if(v===c) sc++;
      li.querySelector('.fbx').innerHTML=`<div class="fb ${v===c?'ok':'no'}"><b>${v===c?'ຖືກຕ້ອງ':(v<0?'ຍັງບໍ່ໄດ້ຕອບ':'ຍັງບໍ່ຖືກ')}</b> · ຄຳຕອບແມ່ນ ${K[c]}. <span>${it.e||''}</span></div>`; });
    const pct=Math.round(sc/items.length*100), b=store.get(storeKey); if(b==null||sc>b) store.set(storeKey,sc);
    const msg=pct>=80?'ດີຫຼາຍ! ເຂົ້າໃຈບົດນີ້ດີແລ້ວ.':pct>=50?'ຜ່ານ. ທົບທວນຂໍ້ທີ່ຜິດອີກຄັ້ງ.':'ຄວນກັບໄປທົບທວນສະໄລ້ ແລະ ບົດເຝິກຫັດຂອງບົດນີ້.';
    const res=f.querySelector('.res');
    res.innerHTML=`<div class="score"><div class="big">${sc}/${items.length}</div><p><b>${pct}%</b> · ${msg}${miss?` (ຍັງບໍ່ໄດ້ຕອບ ${miss} ຂໍ້)`:''}</p></div>`;
    typeset(f); buildNav($('#search').value); res.scrollIntoView({behavior:'smooth',block:'nearest'}); });
}
function renderQuiz(){
  const pane=$('#pane');
  const qa=cur.quiz.map(([q,o,c,e])=>({q,o,c,e}));
  const rv=(M7.rev&&M7.rev[cur.n]||[]).slice().sort((a,b)=>a[0]-b[0]).map(([n,q,o,c,e])=>({n,q,o,c,e}));
  const best=store.get('q'+cur.n), bestR=store.get('r'+cur.n);
  let h=`<section class="qsec"><div class="secttl"><span class="tag">ພາກ ກ</span><h2>ບົດກວດກາທ້າຍບົດ</h2><span class="hint">${qa.length} ຂໍ້${best!=null?` · ຄະແນນສູງສຸດ ${best}/${qa.length}`:''}</span></div>
   <p class="hint" style="margin-top:0">ເລືອກຄຳຕອບທີ່ຖືກຕ້ອງທີ່ສຸດ ແລ້ວກົດ “ກວດຄະແນນ”.</p>${quizForm('qa',qa)}</section>`;
  if(rv.length) h+=`<section class="qsec"><div class="secttl"><span class="tag red">ພາກ ຂ</span><h2>ພາກປາລະໄນ: ສະຫຼຸບບົດຮຽນ ມ.7</h2><span class="hint">${rv.length} ຂໍ້ (ຂໍ້ ${rv.map(x=>x.n).join(', ')})${bestR!=null?` · ຄະແນນສູງສຸດ ${bestR}/${rv.length}`:''}</span></div>
   <p class="hint" style="margin-top:0">ຄຳຖາມຈາກພາກ “ສະຫຼຸບບົດຮຽນ ມັດທະຍົມສຶກສາ ປີທີ 7” ໃນທ້າຍແບບຮຽນ ທີ່ກົງກັບເນື້ອຫາບົດນີ້. ຄຳຕອບໄດ້ກວດຄິດໄລ່ຄືນທຸກຂໍ້; ບ່ອນທີ່ຕ່າງຈາກຕາຕະລາງຄຳຕອບໃນແບບຮຽນ ມີໝາຍເຫດບອກໄວ້.</p>${quizForm('qr',rv,it=>it.n)}</section>`;
  pane.innerHTML=h;
  wireQuiz('qa',qa,'q'+cur.n);
  if(rv.length) wireQuiz('qr',rv,'r'+cur.n);
  typeset(pane);
}
function fromHash(){const h=(location.hash.match(/^#ch(\d+)$/)||[])[1]; if(h){ if(!cur||cur.n!==+h) openCh(+h);} else if(cur) home();}
window.addEventListener('hashchange',fromHash);
if(/^#ch\d+$/.test(location.hash)) fromHash(); else home();
})();
</script>
